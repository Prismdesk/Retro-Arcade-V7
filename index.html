<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101210">
<title>Retro Arcade</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="theme.css">
<style>
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 20px;
  }
  .wrap{
    width: 100%;
    max-width: 420px;
  }
  .subtitle{
    text-align: center;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--screen-mid);
    margin: 0 0 22px 0;
  }
  .grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .card{
    background: var(--screen-bg);
    border: 3px solid var(--accent);
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .card:active{ transform: scale(0.96); }
  .card.disabled{
    background: var(--screen-mid);
    color: var(--page-bg);
    cursor: default;
    opacity: 0.6;
  }
  .glyph{
    width: 100%;
    height: 64px;
  }
  .card-label{
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--screen-fg);
    text-align: center;
  }
  .card.disabled .card-label{ color: var(--page-bg); }
  .card-note{
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--screen-fg);
    opacity: 0.7;
    text-align: center;
  }
  footer{
    margin-top: 24px;
    text-align: center;
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--screen-mid);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">RETRO ARCADE</div>
  <div class="subtitle">CHOOSE A GAME</div>

  <div class="grid">

    <a class="card" href="tetris.html">
      <svg class="glyph" viewBox="0 0 100 64">
        <rect x="30" y="20" width="14" height="14" fill="#40453e"/>
        <rect x="44" y="20" width="14" height="14" fill="#40453e"/>
        <rect x="44" y="6"  width="14" height="14" fill="#40453e"/>
        <rect x="58" y="6"  width="14" height="14" fill="#40453e"/>
        <rect x="70" y="34" width="14" height="14" fill="#40453e"/>
        <rect x="70" y="48" width="14" height="14" fill="#40453e"/>
      </svg>
      <div class="card-label">TETRIS</div>
    </a>

    <a class="card" href="sudoku.html">
      <svg class="glyph" viewBox="0 0 100 64">
        <g fill="none" stroke="#40453e" stroke-width="2.5">
          <rect x="24" y="6" width="52" height="52"/>
          <line x1="41.3" y1="6" x2="41.3" y2="58"/>
          <line x1="58.6" y1="6" x2="58.6" y2="58"/>
          <line x1="24" y1="23.3" x2="76" y2="23.3"/>
          <line x1="24" y1="40.6" x2="76" y2="40.6"/>
        </g>
        <text x="32" y="19" font-family="Courier New, monospace" font-size="11" fill="#40453e">5</text>
        <text x="49" y="36" font-family="Courier New, monospace" font-size="11" fill="#40453e">2</text>
        <text x="66" y="53" font-family="Courier New, monospace" font-size="11" fill="#40453e">9</text>
      </svg>
      <div class="card-label">SUDOKU</div>
    </a>

    <div class="card disabled">
      <svg class="glyph" viewBox="0 0 100 64">
        <g fill="none" stroke="#101210" stroke-width="2" opacity="0.6">
          <rect x="24" y="6" width="52" height="52"/>
          <line x1="24" y1="19" x2="76" y2="19"/>
          <line x1="24" y1="32" x2="76" y2="32"/>
          <line x1="24" y1="45" x2="76" y2="45"/>
          <line x1="37" y1="6" x2="37" y2="58"/>
          <line x1="50" y1="6" x2="50" y2="58"/>
          <line x1="63" y1="6" x2="63" y2="58"/>
        </g>
        <circle cx="30.5" cy="12.5" r="4" fill="#101210" opacity="0.6"/>
        <circle cx="56.5" cy="12.5" r="4" fill="#101210" opacity="0.6"/>
        <circle cx="43.5" cy="25.5" r="4" fill="#101210" opacity="0.6"/>
        <circle cx="69.5" cy="51.5" r="4" fill="#101210" opacity="0.6"/>
      </svg>
      <div class="card-label">CHECKERS</div>
      <div class="card-note">COMING SOON</div>
    </div>

    <div class="card disabled">
      <svg class="glyph" viewBox="0 0 100 64">
        <text x="50" y="42" font-family="Courier New, monospace" font-size="28" fill="#101210" opacity="0.6" text-anchor="middle">+</text>
      </svg>
      <div class="card-label">MORE SOON</div>
      <div class="card-note">STAY TUNED</div>
    </div>

  </div>

  <footer>OFFLINE-READY &middot; INSTALL TO HOME SCREEN</footer>
</div>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then((reg) => console.log('[Retro Arcade] service worker registered', reg.scope))
        .catch((err) => console.error('[Retro Arcade] service worker registration failed', err));
    });
  }
</script>
</body>
</html>
